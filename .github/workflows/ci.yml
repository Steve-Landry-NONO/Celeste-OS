name: Verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - name: Start disposable Supabase
        run: npx supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Apply migrations and verify RLS
        run: |
          npx supabase db reset --local --yes
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres -X -v ON_ERROR_STOP=1 -f supabase/tests/auth_organizations.sql
      - name: Prepare local authentication environment
        run: |
          npx supabase status -o json > "$RUNNER_TEMP/supabase-status.json"
          node scripts/ci-supabase-env.mjs "$RUNNER_TEMP/supabase-status.json"
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Stop disposable Supabase
        if: always()
        run: npx supabase stop --no-backup
