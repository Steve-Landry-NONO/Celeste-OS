name: Validation métier
description: Demande de décision CELESTE OS
title: "[VAL] "
body:
  - type: input
    id: request_id
    attributes:
      label: Identifiant
      placeholder: VAL-001
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question précise
    validations:
      required: true
  - type: textarea
